retain_public: true
strict: true
exclude_tests: true
retain_assign_only_properties: true
retain_objc_accessible: true
retain_objc_annotated: true
retain_unused_protocol_func_params: true
disable_redundant_public_analysis: true
disable_unused_import_analysis: true
report_exclude:
  - Tests/**
index_exclude:
  - .build/**
  - .build-shapes/**
  - Tests/**
  - waterui/**
# The largest shape: the map component only exists behind this condition, and
# without it every symbol it alone reaches is reported unused (waterui#343).
# The test bundle must also link: `waterui_*` symbols only exist once an app
# links the Rust library, so tests are bound lazily via dynamic lookup.
build_arguments:
  - -Xswiftc
  - -DWATERUI_MAP
  - -Xlinker
  - -undefined
  - -Xlinker
  - dynamic_lookup
