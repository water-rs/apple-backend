name: Apple backend CI

permissions:
  contents: read

on:
  # Integration branches only: a topic branch that also has a pull request
  # would otherwise run the whole suite twice for one commit, and every job
  # here draws from the org's five-slot macOS pool.
  push:
    branches: [main, dev]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # None of the lint tools need macOS: swiftformat and ast-grep are pure source
  # tools, and the pinned swiftlint-static binary bundles SourceKit (which the
  # `unused_import` rule requires). Running on Ubuntu frees one slot of the
  # org's five-slot macOS pool for every run. Tool versions are pinned in the
  # cache key; bump them there to upgrade.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: lint-tools
        with:
          path: .ci/bin
          key: lint-tools-v2-swiftlint-0.65.1-swiftformat-0.63.0-ast-grep-0.45.3
      - name: Install lint tools
        if: steps.lint-tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ci/bin && cd .ci/bin
          curl -sSfL -o /tmp/swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          unzip -jo /tmp/swiftlint.zip swiftlint-static -d .
          mv swiftlint-static swiftlint
          curl -sSfL -o /tmp/swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat_linux.zip
          unzip -jo /tmp/swiftformat.zip -d .
          mv swiftformat_linux swiftformat
          curl -sSfL -o /tmp/ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.45.3/app-x86_64-unknown-linux-gnu.zip
          unzip -jo /tmp/ast-grep.zip -d .
          chmod +x swiftlint swiftformat sg ast-grep
      - uses: actions/cache/save@v4
        if: steps.lint-tools.outputs.cache-hit != 'true'
        with:
          path: .ci/bin
          key: ${{ steps.lint-tools.outputs.cache-primary-key }}
      - run: echo "$PWD/.ci/bin" >> "$GITHUB_PATH"
      - name: SwiftFormat lint
        run: swiftformat . --lint --config .swiftformat
      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml
      - name: ast-grep
        run: ast-grep scan Sources Tests --inline-rules "$(cat .ci/sg/swift.yml)" --report-style short

  # Every Swift compilation condition the water CLI can hand this package
  # (`apple_swift_conditions` in waterui's cli/src/apple/platform.rs) is built:
  # `WATERUI_MAP` adds the map component; `WATERUI_NO_GPU` removes the GPU
  # surface. Neither is compiled by the default shape, and a symbol used only
  # behind one of them once shipped deleted (waterui#343).
  #
  # The three shapes are steps of one job per configuration, not a matrix
  # axis: they share the checkout and the header sync, and macOS runners are
  # what the org's concurrent-job cap runs out of, so one job that builds
  # three shapes in a row gets through the queue where three jobs wait on
  # three runners. Each shape gets its own scratch path because -Xswiftc
  # flags invalidate SwiftPM's whole build plan — a shared `.build` would be
  # fully rewritten by every shape and the cache would only ever warm the
  # last one. Per-shape scratch dirs let all three restore warm.
  build:
    name: build (${{ matrix.configuration }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Sync WaterUI header
        run: ./.github/scripts/setup-waterui.sh
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            .build
            .build-shapes
          key: swiftpm-${{ matrix.configuration }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**', '.periphery.yml') }}
          restore-keys: swiftpm-${{ matrix.configuration }}-
      - name: Build (default)
        run: >-
          swift build --configuration ${{ matrix.configuration }}
          --scratch-path .build-shapes/default
          -Xswiftc -warnings-as-errors
      - name: Build (map)
        run: >-
          swift build --configuration ${{ matrix.configuration }}
          --scratch-path .build-shapes/map
          -Xswiftc -warnings-as-errors -Xswiftc -DWATERUI_MAP
      - name: Build (no-gpu)
        run: >-
          swift build --configuration ${{ matrix.configuration }}
          --scratch-path .build-shapes/nogpu
          -Xswiftc -warnings-as-errors -Xswiftc -DWATERUI_NO_GPU
      # The unit suite exercises the closure-based machinery around the FFI
      # surface — signal subscriptions, watcher plumbing, the layout bridge's
      # SubView vtable — with the Rust library absent: `waterui_*` symbols only
      # arrive when an app links the Rust library, so the test bundle is built
      # with dynamic lookup and binds lazily what it never calls. A test that
      # needs the real FFI belongs to the nightly e2e, not here. Debug only:
      # the release shape adds nothing the suite can observe.
      - name: Test
        if: matrix.configuration == 'debug'
        run: >-
          swift test --scratch-path .build-shapes/default
          -Xswiftc -warnings-as-errors
          -Xlinker -undefined -Xlinker dynamic_lookup
      # Scans the largest shape (`.periphery.yml` passes `-DWATERUI_MAP`), so
      # code that only the map component reaches counts as used. Lives inside
      # this job rather than its own: a separate job cost a whole macOS slot
      # just to redo checkout, header sync and brew. Its scan build lands in
      # `.build` next to the shape dirs and stays cached.
      - name: Install Periphery
        if: matrix.configuration == 'debug'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install periphery
      - name: Run Periphery
        if: matrix.configuration == 'debug'
        run: periphery scan --config .periphery.yml

  # A release is a merge into `main`, and `main` only accepts `dev`. The
  # nightly is the only run of the example e2e suite, so a `dev` it has not
  # passed must not be released: this check requires the newest completed
  # nightly run at the pull request's head commit — scheduled or dispatched,
  # the inputs are the same — to have succeeded. A red or cancelled run, or
  # no run at all because `dev` moved since the last one, fails the check
  # with the run to look at or the dispatch to make. Only `main` is gated;
  # fixes land on `dev` through pull requests this check never sees.
  nightly-healthy:
    name: Nightly healthy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require a green nightly at the head commit
        run: |
          set -euo pipefail
          run="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?head_sha=${HEAD_SHA}&status=completed&per_page=1" \
            --jq 'if (.workflow_runs | length) == 0 then "" else .workflow_runs[0] | .conclusion + " " + .html_url end')"
          if [ -z "${run}" ]; then
            echo "::error::no completed nightly run exists at ${HEAD_SHA}; dispatch the Nightly workflow on dev at this commit and re-run this check once it is green"
            exit 1
          fi
          if [ "${run%% *}" != "success" ]; then
            echo "::error::the newest nightly run at ${HEAD_SHA} concluded '${run%% *}' (${run#* }); a release needs a green nightly at the commit being released"
            exit 1
          fi
          echo "nightly at ${HEAD_SHA} is green: ${run#* }"
