[package]
name = "waterui-apple-kit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "A safe, idiomatic Rust API over AppKit and UIKit, built on objc2"
keywords = ["appkit", "uikit", "objc2", "macos", "ios"]
categories = ["gui", "os::macos-apis", "api-bindings"]

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin", "aarch64-apple-ios"]

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
libc = "0.2"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFError",
    "CFString",
    "CFURL",
] }
objc2-core-text = { version = "0.3", default-features = false, features = [
    "std",
    "CTFontManager",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSArray",
    "NSBundle",
    "NSDictionary",
    "NSEnumerator",
    "NSGeometry",
    "NSKeyValueObserving",
    "NSLocale",
    "NSNotification",
    "NSObjCRuntime",
    "NSOperation",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CATransaction",
] }
# `os_log` is a family of C macros; this crate compiles the one-line wrapper
# that forwards a preformatted `%{public}s` message through them.
oslog = { version = "0.2", default-features = false }
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
bitflags = "2"
mach2 = "0.7"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSAppearance",
    "NSApplication",
    "NSEvent",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSWindow",
] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "UIApplication",
    "UIEvent",
    "UIGeometry",
    "UIInterface",
    "UIResponder",
    "UIScene",
    "UISceneOptions",
    "UISceneSession",
    "UITrait",
    "UITraitCollection",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }
