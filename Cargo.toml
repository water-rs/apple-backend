# Until the cocoa-ui additions in this wave merge upstream, build from the sibling
# checkout. The `rev` pin above is the commit this patch carries; drop the
# patch once that commit is on `dev`.
[patch."https://github.com/water-rs/cocoa-ui"]
cocoa-ui = { path = "../cocoa-ui" }

[workspace]
members = []
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/water-rs/apple-backend"

[workspace.lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
clippy.all = "warn"
clippy.style = "warn"
clippy.correctness = "warn"
clippy.complexity = "warn"
clippy.suspicious = "warn"
clippy.perf = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
clippy.undocumented_unsafe_blocks = "warn"
clippy.multiple_crate_versions = { level = "allow", priority = 1 }
