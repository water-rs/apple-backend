[package]
name = "waterui-apple"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The WaterUI backend for Apple platforms: AppKit and UIKit driven from Rust through cocoa-ui, with an Objective-C seam for views the Swift fallback still owns"
keywords = ["gui", "appkit", "uikit"]
publish = false

[lints]
workspace = true

[features]
# Component ports are feature-gated so unused ones leave no code or
# dependency in the artifact; the default is everything ported so far.
default = ["button", "image", "text"]
button = []
image = []
text = []

[dependencies]
waterui = { git = "https://github.com/water-rs/waterui", rev = "ec7d5ad2022f3b3cadf149d372adb18a3f4da74a" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "ec7d5ad2022f3b3cadf149d372adb18a3f4da74a" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "ec7d5ad2022f3b3cadf149d372adb18a3f4da74a" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "ec7d5ad2022f3b3cadf149d372adb18a3f4da74a" }
cocoa-ui = { git = "https://github.com/water-rs/cocoa-ui", rev = "7a7faf4dd74470501aa4cd422178d0893904fdae" }
waterkit-screen = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }
executor-core = { version = "0.7.1", features = ["std"] }
native-executor = "0.8.0"
dispatch2 = "0.3"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-oslog = "0.2"
tracing-panic = "0.1"

objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSAttributedString",
] }

# The framework's own `[patch.crates-io]`, translated for this consumer the
# same way `water`'s scaffolds do it: member path pins become git pins at the
# resolved `dev` revision, the rest ride verbatim.
[patch.crates-io]
