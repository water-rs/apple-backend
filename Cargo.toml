# The coordinated Cherenkov cutover: `waterui-graphics`'s engine moved to
# the cherenkov workspace, which publishes nothing yet — every cherenkov
# and filtrate crate in the graph must come from this same revision or the
# filter types disagree across it.
cherenkov = { git = "https://github.com/water-rs/cherenkov", rev = "522365616cff08d5d2e39bdae4690610593895e6" }
cherenkov-cpu = { git = "https://github.com/water-rs/cherenkov", rev = "522365616cff08d5d2e39bdae4690610593895e6" }
cherenkov-gpu = { git = "https://github.com/water-rs/cherenkov", rev = "522365616cff08d5d2e39bdae4690610593895e6" }
filtrate = { git = "https://github.com/water-rs/cherenkov", rev = "522365616cff08d5d2e39bdae4690610593895e6" }
filtrate-core = { git = "https://github.com/water-rs/cherenkov", rev = "522365616cff08d5d2e39bdae4690610593895e6" }
filtrate-derive = { git = "https://github.com/water-rs/cherenkov", rev = "522365616cff08d5d2e39bdae4690610593895e6" }
# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace*
# globals instead of their value and crashes in CGColorSpaceCreateWithName
# whenever a surface negotiates Extended Display P3 or BT.2100
# (gfx-rs/wgpu#10175, fixed on trunk, not yet released for v30). Mirrored
# from the framework's own patch — `[patch]` in a dependency's manifest
# does not apply downstream. Drop once wgpu-hal 30.0.2 ships the backport.
naga = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-wasm = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "bdc07b2488cef4823ed7995dd56384b2383d7348" }
# codec@d266ae57 asks for shaderloom's `runtime` feature, added after the
# 0.1.2 registry release; this is the rev waterkit pins itself.
shaderloom = { git = "https://github.com/water-rs/shaderloom", rev = "84c37c8314f1bb6d228fce30f78d94872247a18f" }

[workspace]
members = []
# The e2e workflows check the framework and the CLI out inside this
# repository (`.github/scripts/setup-e2e.sh`); they are their own packages,
# not members of this workspace.
exclude = ["waterui", "water-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/water-rs/apple-backend"

[workspace.lints]
rust.missing_docs = "warn"
rust.missing_debug_implementations = "warn"
clippy.all = "warn"
clippy.style = "warn"
clippy.correctness = "warn"
clippy.complexity = "warn"
clippy.suspicious = "warn"
clippy.perf = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"
clippy.cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
clippy.undocumented_unsafe_blocks = "warn"
clippy.multiple_crate_versions = { level = "allow", priority = 1 }
# `with_env` is a public feature name; renaming it would break consumers.
clippy.redundant_feature_names = { level = "allow", priority = 1 }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "hot_paths"
harness = false
