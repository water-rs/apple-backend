[package]
name = "waterui-apple"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The native WaterUI backend for Apple platforms, with AppKit and UIKit driven from Rust through objc2"
keywords = ["gui", "appkit", "uikit"]
publish = false
autotests = false

[lints]
workspace = true

[features]
# Component ports are feature-gated so unused ones leave no code or
# dependency in the artifact; the default is everything ported so far.
default = [
    "anchored_overlay",
    "applied_filter",
    "accessibility_identifier",
    "accessibility_metadata",
    "badge",
    "button",
    "clip_shape",
    "gpu_surface",
    "color_picker",
    "container",
    "context_menu",
    "cursor",
    "date_picker",
    "draggable",
    "drop_destination",
    "dynamic",
    "dynamic_range",
    "fixed_container",
    "focused",
    "glass_background",
    "ignore_safe_area",
    "hittable",
    "gesture",
    "image",
    "layer_transform",
    "layout_priority",
    "lifecycle_hook",
    "material_background",
    "menu",
    "offset",
    "rotation",
    "scale",
    "border",
    "shadow",
    "opacity",
    "list",
    "multi_date_picker",
    "navigation",
    "on_event",
    "on_key_press",
    "picker",
    "picture",
    "progress",
    "resolved_color",
    "resolved_gradient",
    "resolved_shape",
    "retain",
    "scroll",
    "secure",
    "secure_field",
    "slider",
    "spacer",
    "stepper",
    "table",
    "text",
    "text_field",
    "toggle",
    "view_effect",
    "view_renderer",
    "with_env",
]
anchored_overlay = []
accessibility_identifier = []
applied_filter = ["gpu_surface"]
accessibility_metadata = []
badge = []
border = []
button = []
clip_shape = []
gpu_surface = []
color_picker = []
container = []
context_menu = []
cursor = []
date_picker = []
draggable = []
drop_destination = []
dynamic = []
dynamic_range = []
fixed_container = []
focused = []
glass_background = []
ignore_safe_area = []
hittable = []
gesture = []
layout_priority = []
image = []
lifecycle_hook = []
layer_transform = []
list = []
# `cocoa-ui/map` brings `MKMapView`, the `MapKit` framework link and the
# `CoreLocation` types; an app that never uses the leaf gets none of it.
map = ["dep:waterui-map", "cocoa-ui/map"]
material_background = []
menu = []
offset = []
opacity = []
multi_date_picker = []
navigation = []
on_event = []
on_key_press = []
picker = []
plain = []
picture = []
progress = []
resolved_color = []
resolved_gradient = []
resolved_shape = []
retain = []
rotation = ["layer_transform"]
scale = ["layer_transform"]
scroll = []
secure = []
secure_field = []
shadow = []
slider = []
spacer = []
stepper = []
table = []
text = []
text_field = []
toggle = []
view_effect = ["gpu_surface"]
view_renderer = []
webview = ["dep:waterui-webview", "dep:cookie", "cocoa-ui/webview"]
# `media` is the name the `water` CLI's capability mechanism (`waterui-video`
# in the app's resolved graph) forwards to this crate; it turns on both
# leaves the media semantic needs.
media = ["video", "video_player"]
# `cocoa-ui/avkit` brings the `AVFoundation`/`AVKit` framework links; an app
# without media compiles and links none of it.
video = ["dep:waterui-video", "dep:waterkit-audio", "cocoa-ui/avkit"]
video_player = ["dep:waterui-video", "dep:waterkit-audio", "cocoa-ui/avkit"]
with_env = []

# Harness-only reach for `Tests/native.rs`: compiles the doc(hidden)
# `native_test_support` module (private windows + embedding internals),
# never part of a production build.
native-test-support = []

[dependencies]
waterui = { git = "https://github.com/water-rs/waterui", rev = "0c36500e7de8899fd913cc351371370f21e52551", features = ["inspector"] }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "0c36500e7de8899fd913cc351371370f21e52551" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "0c36500e7de8899fd913cc351371370f21e52551", features = ["overlay"] }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "0c36500e7de8899fd913cc351371370f21e52551" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "0c36500e7de8899fd913cc351371370f21e52551", optional = true }
# The GPU components the backend owns (`gpu_surface`, `view_effect`,
# `picture`, `resolved_gradient`) are Rust semantic types here, not FFI
# pointers: `cpu-scene` is what `picture`'s rasteriser needs beyond `gpu`.
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "0c36500e7de8899fd913cc351371370f21e52551", features = [
    "gpu",
    "cpu",
] }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "0c36500e7de8899fd913cc351371370f21e52551" }
# HAL access to the runtime device for native Metal presentation.
wgpu-hal = { version = "30.0.1", features = ["metal"] }
objc2-metal = { version = "0.3", features = [
    "MTLCommandBuffer",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
] }
cocoa-ui = { git = "https://github.com/water-rs/cocoa-ui", rev = "e29cea610cba5f8a21763b7ebb331a95f4a02915" }
# Optional component dependencies — a port's feature gates them so an app
# that never uses the component links none of it.
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "0c36500e7de8899fd913cc351371370f21e52551", optional = true }
# The cookie type `waterui-webview`'s handle contract answers with —
# `time`/`SameSite` rebuild cookies from `NSHTTPCookie` records.
cookie = { version = "0.18.2", optional = true }
waterkit-audio = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96", features = ["media-session"], optional = true }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "0c36500e7de8899fd913cc351371370f21e52551", optional = true }
executor-core = { version = "0.7.1", features = ["std"] }
async-channel = "2"
futures = "0.3"
native-executor = "0.8.0"
kurbo = "0.13"
dispatch2 = "0.3"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-panic = "0.1"

objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSAttributedString",
    "NSDate",
    "NSValue",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGPath",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "CAShapeLayer",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }


